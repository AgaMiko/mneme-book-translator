<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 360" width="1040" height="360" role="img" aria-labelledby="t d">
  <title id="t">Mneme pipeline</title>
  <desc id="d">Seven steps from an uploaded .docx to an exported translation. Glossary and voices are reviewed by the author. Every step writes to the book's memory in Postgres, which the translation step reads.</desc>
  <style>
    .serif { font-family: Lora, Georgia, "Times New Roman", serif; }
    .sans { font-family: Inter, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .bg { fill: #f3efe6; }
    .card { fill: #fffdf8; stroke: #d6d2ca; stroke-width: 1.2; }
    .card-key { fill: #fffdf8; stroke: #b76a4a; stroke-width: 1.6; }
    .num { fill: #b76a4a; font-size: 11px; font-weight: 600; letter-spacing: 0.08em; }
    .label { fill: #0f1115; font-size: 16px; font-weight: 600; }
    .sub { fill: #6e6862; font-size: 11.5px; }
    .arrow { stroke: #6e6862; stroke-width: 1.4; fill: none; }
    .link { stroke: #b76a4a; stroke-width: 1.2; stroke-dasharray: 3 4; fill: none; }
    .tag { fill: rgba(183,106,74,0.12); }
    .tag-text { fill: #b76a4a; font-size: 10.5px; font-weight: 600; }
    .mem { fill: #e5e1da; stroke: #d6d2ca; stroke-width: 1.2; }
    .mem-title { fill: #2a2522; font-size: 14px; font-weight: 600; }
    .mem-text { fill: #2a2522; font-size: 12px; }
    .h1 { fill: #0f1115; font-size: 26px; font-weight: 600; }
    .h2 { fill: #b76a4a; font-size: 15px; font-style: italic; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6e6862"/>
    </marker>
    <marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b76a4a"/>
    </marker>
  </defs>

  <rect class="bg" width="1040" height="360" rx="14"/>

  <text class="serif h1" x="20" y="46">Mneme</text>
  <text class="serif h2" x="138" y="46">Translation that remembers.</text>

  <!-- step cards: x = 20 + i*146, width 124 -->
  <g class="sans">
    <rect class="card" x="20" y="78" width="124" height="88" rx="10"/>
    <text class="num" x="34" y="100">01</text>
    <text class="label" x="34" y="122">Upload</text>
    <text class="sub" x="34" y="141">.docx split into</text>
    <text class="sub" x="34" y="156">chapters</text>

    <rect class="card" x="166" y="78" width="124" height="88" rx="10"/>
    <text class="num" x="180" y="100">02</text>
    <text class="label" x="180" y="122">Metadata</text>
    <text class="sub" x="180" y="141">title, author,</text>
    <text class="sub" x="180" y="156">setting</text>

    <rect class="card-key" x="312" y="78" width="124" height="88" rx="10"/>
    <text class="num" x="326" y="100">03</text>
    <text class="label" x="326" y="122">Glossary</text>
    <text class="sub" x="326" y="141">names, places,</text>
    <text class="sub" x="326" y="156">invented terms</text>

    <rect class="card" x="458" y="78" width="124" height="88" rx="10"/>
    <text class="num" x="472" y="100">04</text>
    <text class="label" x="472" y="122">Speakers</text>
    <text class="sub" x="472" y="141">who says each</text>
    <text class="sub" x="472" y="156">line, to whom</text>

    <rect class="card-key" x="604" y="78" width="124" height="88" rx="10"/>
    <text class="num" x="618" y="100">05</text>
    <text class="label" x="618" y="122">Voices</text>
    <text class="sub" x="618" y="141">a profile for</text>
    <text class="sub" x="618" y="156">each character</text>

    <rect class="card" x="750" y="78" width="124" height="88" rx="10"/>
    <text class="num" x="764" y="100">06</text>
    <text class="label" x="764" y="122">Translate</text>
    <text class="sub" x="764" y="141">fragments of</text>
    <text class="sub" x="764" y="156">~1,200 words</text>

    <rect class="card" x="896" y="78" width="124" height="88" rx="10"/>
    <text class="num" x="910" y="100">07</text>
    <text class="label" x="910" y="122">Export</text>
    <text class="sub" x="910" y="141">PDF, EPUB</text>
    <text class="sub" x="910" y="156">or DOCX</text>
  </g>

  <!-- arrows between cards -->
  <g>
    <line class="arrow" x1="146" y1="122" x2="163" y2="122" marker-end="url(#a)"/>
    <line class="arrow" x1="292" y1="122" x2="309" y2="122" marker-end="url(#a)"/>
    <line class="arrow" x1="438" y1="122" x2="455" y2="122" marker-end="url(#a)"/>
    <line class="arrow" x1="584" y1="122" x2="601" y2="122" marker-end="url(#a)"/>
    <line class="arrow" x1="730" y1="122" x2="747" y2="122" marker-end="url(#a)"/>
    <line class="arrow" x1="876" y1="122" x2="893" y2="122" marker-end="url(#a)"/>
  </g>

  <!-- review tags -->
  <g class="sans">
    <rect class="tag" x="326" y="176" width="96" height="22" rx="11"/>
    <text class="tag-text" x="374" y="191" text-anchor="middle">YOU REVIEW</text>
    <rect class="tag" x="618" y="176" width="96" height="22" rx="11"/>
    <text class="tag-text" x="666" y="191" text-anchor="middle">YOU REVIEW</text>
  </g>

  <!-- writes into memory -->
  <g>
    <path class="link" d="M82,166 V254" marker-end="url(#ac)"/>
    <path class="link" d="M228,166 V254" marker-end="url(#ac)"/>
    <path class="link" d="M374,198 V254" marker-end="url(#ac)"/>
    <path class="link" d="M520,166 V254" marker-end="url(#ac)"/>
    <path class="link" d="M666,198 V254" marker-end="url(#ac)"/>
    <!-- translate reads from memory -->
    <path class="link" d="M812,256 V170" marker-end="url(#ac)"/>
  </g>

  <!-- memory band -->
  <g class="sans">
    <rect class="mem" x="20" y="258" width="1000" height="78" rx="10"/>
    <text class="mem-title" x="40" y="286">Book memory · Postgres</text>
    <text class="mem-text" x="40" y="312">structure · metadata · accepted glossary · dialogue lines · voice profiles and briefs · translation progress</text>
    <text class="mem-text" x="1000" y="286" text-anchor="end" fill="#6e6862">runs can be stopped and continued</text>
  </g>
</svg>
