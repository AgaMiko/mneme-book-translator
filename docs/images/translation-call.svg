<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 440" width="1040" height="440" role="img" aria-labelledby="t d">
  <title id="t">One translation call</title>
  <desc id="d">Each fragment is translated in one call. The call gets a cached fixed part (rules, style sheet, accepted glossary), the voice profiles of the characters in the scene, the neighbouring text, and the fragment itself. It returns the same paragraphs in English, which are then checked.</desc>
  <style>
    .serif { font-family: Lora, Georgia, "Times New Roman", serif; }
    .sans { font-family: Inter, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .bg { fill: #f3efe6; }
    .card { fill: #fffdf8; stroke: #d6d2ca; stroke-width: 1.2; }
    .cached { fill: #fffdf8; stroke: #b76a4a; stroke-width: 1.6; }
    .label { fill: #0f1115; font-size: 15px; font-weight: 600; }
    .sub { fill: #6e6862; font-size: 12px; }
    .pill { fill: rgba(183,106,74,0.12); }
    .pill-text { fill: #b76a4a; font-size: 10.5px; font-weight: 600; letter-spacing: 0.04em; }
    .model { fill: #2a2522; }
    .model-title { fill: #f3efe6; font-size: 17px; font-weight: 600; }
    .model-sub { fill: #c9c2b5; font-size: 12px; }
    .arrow { stroke: #6e6862; stroke-width: 1.4; fill: none; }
    .para-pl { fill: #e5e1da; }
    .para-en { fill: rgba(183,106,74,0.22); }
    .pnum { fill: #6e6862; font-size: 10.5px; }
    .h1 { fill: #0f1115; font-size: 20px; font-weight: 600; }
    .note { fill: #2a2522; font-size: 12px; }
    .ok { fill: #2f6b3e; font-size: 12px; font-weight: 600; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6e6862"/>
    </marker>
  </defs>

  <rect class="bg" width="1040" height="440" rx="14"/>
  <text class="serif h1" x="20" y="42">What one translation call gets</text>

  <!-- inputs: x 20, width 440 -->
  <g class="sans">
    <rect class="cached" x="20" y="64" width="440" height="78" rx="10"/>
    <text class="label" x="38" y="90">Fixed part</text>
    <rect class="pill" x="346" y="76" width="98" height="20" rx="10"/>
    <text class="pill-text" x="395" y="90" text-anchor="middle">CACHED · ~1/10</text>
    <text class="sub" x="38" y="112">translation rules, the book's style sheet (spelling,</text>
    <text class="sub" x="38" y="129">quotes, units, scene breaks), the accepted glossary</text>

    <rect class="card" x="20" y="152" width="440" height="62" rx="10"/>
    <text class="label" x="38" y="178">Voices in the scene</text>
    <text class="sub" x="38" y="199">profiles of characters who speak or are named here</text>

    <rect class="card" x="20" y="224" width="440" height="62" rx="10"/>
    <text class="label" x="38" y="250">Neighbouring text</text>
    <text class="sub" x="38" y="271">end of the previous fragment (Polish + English), start of the next</text>

    <rect class="card" x="20" y="296" width="440" height="100" rx="10"/>
    <text class="label" x="38" y="322">The fragment, paragraph by paragraph</text>
    <text class="pnum" x="38" y="346">¶1</text>
    <rect class="para-pl" x="60" y="338" width="300" height="10" rx="5"/>
    <text class="pnum" x="38" y="364">¶2</text>
    <rect class="para-pl" x="60" y="356" width="370" height="10" rx="5"/>
    <text class="pnum" x="38" y="382">¶3</text>
    <rect class="para-pl" x="60" y="374" width="220" height="10" rx="5"/>
  </g>

  <!-- arrows into model -->
  <g>
    <path class="arrow" d="M460,103 C500,103 500,230 536,230" marker-end="url(#a)"/>
    <path class="arrow" d="M460,183 C496,183 500,230 536,230" marker-end="url(#a)"/>
    <path class="arrow" d="M460,255 C496,255 500,230 536,230" marker-end="url(#a)"/>
    <path class="arrow" d="M460,346 C500,346 500,230 536,230" marker-end="url(#a)"/>
  </g>

  <!-- model -->
  <g class="sans">
    <rect class="model" x="540" y="178" width="190" height="104" rx="12"/>
    <text class="model-title" x="635" y="216" text-anchor="middle">gpt-6.1-sol</text>
    <text class="model-sub" x="635" y="240" text-anchor="middle">high thinking</text>
    <text class="model-sub" x="635" y="258" text-anchor="middle">Flex tier, half price</text>
  </g>

  <path class="arrow" d="M732,230 L770,230" marker-end="url(#a)"/>

  <!-- output -->
  <g class="sans">
    <rect class="card" x="774" y="152" width="246" height="156" rx="10"/>
    <text class="label" x="792" y="178">Fluent English</text>
    <text class="sub" x="792" y="198">same paragraphs, same order</text>
    <text class="pnum" x="792" y="226">¶1</text>
    <rect class="para-en" x="814" y="218" width="160" height="10" rx="5"/>
    <text class="pnum" x="792" y="244">¶2</text>
    <rect class="para-en" x="814" y="236" width="190" height="10" rx="5"/>
    <text class="pnum" x="792" y="262">¶3</text>
    <rect class="para-en" x="814" y="254" width="120" height="10" rx="5"/>
    <text class="sub" x="792" y="292">+ translator notes</text>

    <rect class="card" x="774" y="318" width="246" height="78" rx="10"/>
    <text class="ok" x="792" y="342">Checks</text>
    <text class="note" x="792" y="362">leftover Polish letters, dialogue,</text>
    <text class="note" x="792" y="380">placeholders, glossary drift</text>
  </g>

  <text class="sans sub" x="20" y="424">A 100,000-word novel costs about $11–14 to translate this way.</text>
</svg>
