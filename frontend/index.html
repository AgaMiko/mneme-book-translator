<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mneme · Translation that remembers</title>
    <meta
      name="description"
      content="Memory-first AI translation pipeline for fiction. Glossary-driven, author-in-the-loop. Polish→English and any language pair."
    />

    <!-- Mobile browser chrome adopts these to match the active theme.
         Modern browsers respect `media` and pick the right one without JS. -->
    <meta name="theme-color" content="#f3efe6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)" />

    <!-- Open Graph / social previews. -->
    <meta property="og:title" content="Mneme · Translation that remembers" />
    <meta
      property="og:description"
      content="Memory-first AI translation pipeline for fiction. Glossary-driven, author-in-the-loop."
    />
    <meta property="og:type" content="website" />

    <!--
      Theme bootstrap. Runs before any CSS paints to prevent a white
      flash for users whose stored or system preference is dark. The
      logic mirrors useTheme exactly; both must agree on the resolution
      order (stored → system → light) so the React mount sees the same
      theme the bootstrap script set.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("mneme:theme");
          var theme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.setAttribute("data-theme", theme);
        } catch (_) {
          // localStorage may be unavailable in some embeds; fall back
          // gracefully to the light default already implied by :root.
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>

    <!--
      Three voices: Inter for UI chrome (per brand board), Lora for the
      literary reading surface and the wordmark, JetBrains Mono for
      technical metadata.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
